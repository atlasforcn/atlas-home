<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的個人網站</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#intro">簡介</a></li>
                <li><a href="#blog">部落格</a></li>
                <li><a href="#timeline">時間軸</a></li>
                <li><a href="#resume">履歷</a></li>
                <li><a href="https://github.com/atlasforcn/atlas-home" target="_blank">GitHub</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="intro" class="hero">
            <div class="container">
                <img src="https://via.placeholder.com/150" alt="個人頭像" class="profile-pic">
                <h1>您的名字</h1>
                <p class="subtitle">您的職稱 / 簡短介紹</p>
                <p>這是一個關於我的簡短介紹。我熱衷於 [您的興趣/領域]，並致力於 [您的目標/專長]。我喜歡學習新技術，並透過程式碼創造價值。</p>
                <div class="social-links">
                    <a href="https://github.com/atlasforcn/atlas-home" target="_blank">GitHub</a>
                    <a href="#" target="_blank">LinkedIn</a>
                    <a href="#" target="_blank">Twitter</a>
                </div>
            </div>
        </section>

        <div class="main-content-flex">
            <section id="blog">
                <h2>我的部落格</h2>
                <div class="blog-posts">
                </div>
            </section>

            <section id="resume">
                <h2>我的履歷</h2>
                <p>這裡將展示我的專業履歷。</p>
                <a href="resume.html">查看我的履歷</a>
            </section>
        </div>

        <section id="timeline">
            <h2>時間軸</h2>
            <p class="timeline-lead">滑鼠移到節點查看；點下去在下方展開「細節」（顏色依類別區分）。</p>
            <div id="timeline-mt" class="timeline-mt"></div>
            <div id="timeline-mt-details" class="timeline-mt-details" hidden></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 我的個人網站. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
