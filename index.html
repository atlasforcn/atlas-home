<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阿特拉斯的個人網站</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#intro">簡介</a></li>
                <li><a href="#resume">履歷</a></li>
                <li><a href="#blog">部落格</a></li>
                <li><a href="https://github.com/atlasforcn/atlas-home" target="_blank">GitHub</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="intro" class="hero">
            <div class="container">
                <div class="hero-media">
                    <img src="profile_picture.jpg" alt="個人頭像" class="profile-pic">
                </div>
                <div class="hero-copy">
                    <p class="hero-kicker">Space systems / digital resilience / community leadership</p>
                    <h1>Atlas You</h1>
                    <p class="subtitle">航太專案管理者，聚焦 CubeSat 任務整合、數位韌性、資安治理與技術社群協作。</p>
                    <p class="hero-description">目前投入太空任務、國際合作與英文技術培訓；擅長在跨部門與跨文化環境中整合資源、推進任務與建立信任。</p>
                    <div class="social-links" aria-label="社群連結">
                        <a href="https://github.com/atlasforcn/atlas-home" target="_blank">GitHub</a>
                        <a href="#" target="_blank">LinkedIn</a>
                        <a href="#" target="_blank">Twitter</a>
                    </div>
                </div>
            </div>
        </section>

        <section id="profile-tabs" class="profile-tabs">
            <div class="profile-tab-list" role="tablist" aria-label="履歷與部落格">
                <button class="profile-tab active" type="button" id="tab-resume" role="tab" aria-selected="true" aria-controls="resume-panel" data-panel="resume">
                    履歷時間軸
                </button>
                <button class="profile-tab" type="button" id="tab-blog" role="tab" aria-selected="false" aria-controls="blog-panel" data-panel="blog">
                    部落格文章
                </button>
            </div>

            <div id="resume-panel" class="profile-tab-panel active" role="tabpanel" aria-labelledby="tab-resume" data-panel="resume">
                <div id="resume" class="resume-timeline">
                    <h2>我的履歷</h2>
                    <p class="timeline-lead">精簡整理近期履歷重點；展開卡片查看補充細節。</p>
                    <div id="timeline-mt" class="timeline-mt"></div>
                    <div id="timeline-mt-details" class="timeline-mt-details" hidden></div>
                </div>
            </div>

            <div id="blog-panel" class="profile-tab-panel" role="tabpanel" aria-labelledby="tab-blog" data-panel="blog" hidden>
                <div id="blog">
                    <h2>我的部落格</h2>
                    <div class="blog-posts">
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 我的個人網站. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
