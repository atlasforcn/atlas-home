name: Remove diagonal background

on:
  push:
    paths:
      - '.github/workflows/remove-diagonal-background.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove diagonal background overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('style.css')
          text = path.read_text()
          old = ",\n        linear-gradient(120deg, transparent 0 46%, rgba(49, 95, 146, 0.045) 46% 47%, transparent 47% 100%)"
          if old not in text:
              raise SystemExit('diagonal gradient already removed')
          path.write_text(text.replace(old, ''))
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/remove-diagonal-background.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css .github/workflows/remove-diagonal-background.yml
          git commit -m "Remove diagonal background overlay"
          git push
